aid: garmentory
name: Garmentory
description: >-
  Garmentory is a Seattle-based online fashion marketplace that connects shoppers
  with more than 1,000 independent boutiques and emerging designers across 30+
  countries. Backed by Techstars, the platform curates apparel, accessories, and
  footwear from independent retailers, letting boutiques list inventory manually
  or sync it through a Shopify integration. Garmentory runs a heavily customized
  Spree Commerce (Ruby on Rails) storefront and consumes third-party APIs
  (payments, retail media, and merchant onboarding) rather than publishing a
  first-party public developer API. This profile tracks Garmentory's identity and
  public web properties in the API Evangelist network; no OpenAPI, developer
  portal, or API reference is published at this time.
